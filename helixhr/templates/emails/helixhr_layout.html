{#- Developer-owned branded layout for every portal email (plan 2026-10-02-001 R19).
    Rendered by helixhr.utils' sandbox with autoescape on; `content` and `core`
    arrive already rendered (and escaped) as Markup. Inline styles only: mail
    clients drop <style> blocks. -#}
<div style="background:#f4f5f7;padding:24px 12px;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#1f2328;">
  <div style="max-width:600px;margin:0 auto;background:#ffffff;border-radius:8px;overflow:hidden;border:1px solid #e3e5e8;">
    {#- header_bg / header_fg come from helixhr.utils.email_header_colors: always
        a validated #rrggbb, never a raw stored string. -#}
    <div style="background:{{ header_bg or '#ffffff' }};color:{{ header_fg or '#1f2328' }};padding:20px 24px;border-bottom:1px solid {{ (header_bg or '#ffffff') if header_fg == '#ffffff' else '#e3e5e8' }};">
      {% if logo_url %}<img src="{{ logo_url }}" alt="{{ company }}" style="max-height:36px;">{% else %}<strong style="font-size:16px;color:{{ header_fg or '#1f2328' }};">{{ company or "HelixHR" }}</strong>{% endif %}
    </div>
    <div style="padding:24px;font-size:14px;line-height:1.55;">
      <h1 style="font-size:18px;line-height:1.3;margin:0 0 16px;">{{ subject }}</h1>
      {% if core %}{{ core }}{% endif %}
      {{ content }}
      {% if action_url %}
      <p style="margin:24px 0 0;">
        <a href="{{ action_url }}" style="display:inline-block;background:#1f2328;color:#ffffff;text-decoration:none;padding:10px 18px;border-radius:6px;font-weight:600;">{{ action_label }}</a>
      </p>
      {% endif %}
    </div>
    <div style="padding:16px 24px;border-top:1px solid #e3e5e8;font-size:12px;color:#6b7280;">
      Sent by {{ company or "HelixHR" }} through the <a href="{{ portal_url }}" style="color:#6b7280;">HelixHR portal</a>.
    </div>
  </div>
</div>
